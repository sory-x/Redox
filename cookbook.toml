# SoryOS cookbook configuration.
# Mirrors are matched against the URL WITHOUT the protocol prefix, longest
# match wins (see src/config.rs translate_mirror). Package retrieval is handled
# by the signed GitHub Release backend when SORYOS_RELEASE_INDEX_URL is set.
# Pages is only the catalog/signature channel and must not be a binary fallback.
[mirrors]
"ftp.gnu.org/gnu" = "mirrors.ocf.berkeley.edu/gnu"
