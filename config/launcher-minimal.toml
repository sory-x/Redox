# Generated bridge for the SoryOS phase-2 profile.
# Source of truth: ../sory-os/configs/launcher-minimal.toml
# Keep this profile intentionally small until the native desktop is validated.

include = ["desktop-minimal.toml"]

[general]
filesystem_size = 768

[packages]
cosmic-term = {}

[[files]]
path = "/usr/lib/init.d/20_orbital"
data = """
requires_weak 10_net.target 20_audiod.service
nowait VT=3 orbital orblogin launcher
"""

[[files]]
path = "/usr/lib/init.d/30_console"
data = """
requires_weak 20_orbital
nowait getty 2
nowait getty /scheme/debug/no-preserve -J
"""
